# Images selbst bauen statt sie aus GitHub (ghcr.io) zu holen, z. B. zum Testen eigener Änderungen:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# (mit Traefik: docker-compose.traefik.yml statt docker-compose.yml)
services:
  cme-web:
    build: .
  asterisk:
    build: ./asterisk
  recorder:
    build: ./recorder
  push-relay:
    build: ./push-relay
  kamailio:
    build: ./kamailio
  rtpengine:
    build: ./rtpengine
