# Baut die Container-Images bei jedem Push auf main und legt sie in die GitHub Container Registry (ghcr.io).
# Portainer (oder docker compose) holt sie dann nur noch: Stack → "Pull and redeploy" mit "Re-pull image".
# Eigene Kopie (Fork): Images landen unter ghcr.io/<account>/…; im Stack IMAGE_PREFIX=ghcr.io/<account> setzen.
name: Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "softphone/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cme-web
            context: .
          - name: cme-voicemail
            context: ./asterisk
          - name: cme-recorder
            context: ./recorder
          - name: cme-push-relay
            context: ./push-relay
          - name: cme-kamailio
            context: ./kamailio
          - name: cme-rtpengine
            context: ./rtpengine
    steps:
      - uses: actions/checkout@v4

      - name: Registry-Name (Kleinbuchstaben)
        id: reg
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.reg.outputs.prefix }}/${{ matrix.name }}:latest
            ${{ steps.reg.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
