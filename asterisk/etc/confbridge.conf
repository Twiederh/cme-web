; Konferenzraeume: Profile je Raum schreibt cme-web nach cme/confbridge_cme.conf
[general]

; Tasten fuer Teilnehmer: 1 stumm/laut, 4/6 leiser/lauter hoeren
[cme-user-menu]
type=menu
1=toggle_mute
4=decrease_listening_volume
6=increase_listening_volume

; Tasten fuer den Moderator: zusaetzlich 2 Raum sperren/oeffnen, 3 letzten Teilnehmer entfernen,
; 9 alle anderen stumm/laut
[cme-admin-menu]
type=menu
1=toggle_mute
2=admin_toggle_conference_lock
3=admin_kick_last
4=decrease_listening_volume
6=increase_listening_volume
9=admin_toggle_mute_participants

#include cme/confbridge_cme.conf
