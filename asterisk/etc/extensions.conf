[general]
static=yes
writeprotect=yes
; Globale Variablen kommen komplett aus cme/globals.conf: beim Neuladen alte Werte verwerfen
clearglobalvars=yes

[globals]
VM_PILOT=8000
VM_MAIN_OPTS=
; Werte aus cme-web
#include cme/globals.conf

; Anrufe von CME an die Voicemail-Nummer
;  - Anrufer ist fuer die Fernabfrage eines Postfachs eingetragen (VMR_<nummer>, z. B. das Handy):
;    Postfach abfragen - direkt an der Voicemail-Nummer oder wenn der Anruf von diesem Postfach umgeleitet wurde
;  - mit Umleitungsinfo (Diversion) einer Nummer mit Postfach: Nachricht hinterlassen
;  - sonst: Postfach abfragen (eigenes Postfach anhand der Anrufernummer)
[from-cme]
; zuerst die Fax-, IVR- und Warteschlangen-Nummern aus cme-web, dann der Aufzeichnungshinweis, sonst Voicemail
include => cme-numbers
include => cme-queues
include => cme-recnotice
include => cme-voicemail

[cme-voicemail]
exten => _[+0-9*#].,1,Verbose(1,Voicemail: ${EXTEN} von ${CALLERID(num)}, umgeleitet von ${REDIRECTING(from-num)} (${REDIRECTING(reason)}))
 same => n,Set(REDIR=${FILTER(0-9,${REDIRECTING(from-num)})})
 same => n,Set(CALLER=${FILTER(0-9,${CALLERID(num)})})
 same => n,Gosub(cme-normkey,s,1(${CALLER}))
 same => n,Set(RBOX=${IF($["${GOSUB_RETVAL}" != ""]?${GLOBAL(VMR_${GOSUB_RETVAL})}:)})
 same => n,Set(RPIN=${IF($["${GOSUB_RETVAL}" != ""]?${GLOBAL(VMRP_${GOSUB_RETVAL})}:)})
 same => n,GotoIf($["${REDIR}" != "" & "${REDIR}" != "${CALLER}"]?check)
 same => n(main),Answer()
 same => n,Wait(0.5)
 same => n,GotoIf($["${RBOX}" != ""]?remote)
 same => n,GotoIf($["${CALLER}" != "" & ${VM_INFO(${CALLER}@default,exists)}]?own)
 same => n,VoiceMailMain(@default)
 same => n,Hangup()
 same => n(own),VoiceMailMain(${CALLER}@default,${VM_MAIN_OPTS})
 same => n,Hangup()
 same => n(remote),Verbose(1,Fernabfrage Postfach ${RBOX} von ${CALLERID(num)})
 same => n,VoiceMailMain(${RBOX}@default,${IF($["${RPIN}" = "0"]?s:)})
 same => n,Hangup()
 same => n(check),GotoIf($["${RBOX}" != "" & "${RBOX}" = "${REDIR}"]?main)
 same => n,GotoIf(${VM_INFO(${REDIR}@default,exists)}?leave:main)
 same => n(leave),Set(OPT=${IF($["${REDIRECTING(reason)}" = "cfb" | "${REDIRECTING(reason)}" = "user-busy"]?b:u)})
 same => n,VoiceMail(${REDIR}@default,${OPT})
 same => n,Hangup()

; Anrufernummer in die Vergleichsform bringen (wie vm_key in cme-web):
; nur Ziffern, ohne fuehrende Nullen, ohne 49 bei deutschen Nummern mit Laendervorwahl
[cme-normkey]
exten => s,1,Set(K=${FILTER(0-9,${ARG1})})
 same => n(loop),GotoIf($["${K:0:1}" = "0"]?:cc)
 same => n,Set(K=${K:1})
 same => n,Goto(loop)
 same => n(cc),GotoIf($["${K:0:2}" = "49" & ${LEN(${K})} >= 12]?:done)
 same => n,Set(K=${K:2})
 same => n(done),Return(${K})

; Fax empfangen (Nummern in cme/extensions_cme.conf setzen FAXMAIL, FAXNAME, FAXNUM)
[cme-fax]
exten => s,1,Verbose(1,Fax fuer ${FAXNUM} von ${CALLERID(num)})
 same => n,Set(FAXFILE=/var/spool/asterisk/voicemail/fax/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${FILTER(0-9,${UNIQUEID})})
 same => n,Set(FAXOPT(ecm)=yes)
 same => n,Answer()
 same => n,ReceiveFax(${FAXFILE}.tif)
 same => n,Hangup()
; nach dem Auflegen: PDF erzeugen und per Mail verschicken
exten => h,1,System(/usr/bin/python3 /usr/local/bin/fax-mail.py "${FAXFILE}" "${FAXMAIL}" "${FILTER(0-9A-Za-z_,${FAXSTATUS})}" "${FILTER(0-9,${FAXPAGES})}" "${FILTER(0-9A-Za-z_,${FAXERROR})}" "${FILTER(0-9A-Za-z +._-,${REMOTESTATIONID})}" "${FILTER(0-9+*#,${CALLERID(num)})}" "${FAXNUM}" "${FAXNAME}")

; Sprachmenues und Nummern von cme-web
#include cme/extensions_cme.conf
; Hinweis vor aufgezeichneten Gespraechen (cme-web, Tab Aufzeichnung)
#include cme/extensions_rec.conf
; Warteschlangen (cme-web, Tab Voicemail)
#include cme/extensions_queue.conf
