[general]
format=wav
serveremail=voicemail@cme.local
fromstring=Voicemail
attach=yes
charset=UTF-8
; Mail mit Abschrift: vm-mail.py transkribiert (Whisper) und verschickt per SMTP
mailcmd=/usr/bin/python3 /usr/local/bin/vm-mail.py
emaildateformat=%d.%m.%Y um %H:%M
emailsubject=Neue Sprachnachricht von ${VM_CALLERID}
emailbody=Hallo ${VM_NAME},\n\n${VM_CALLERID} hat am ${VM_DATE} eine Sprachnachricht hinterlassen (Dauer ${VM_DUR}).\n\nAbschrift:\n@@ABSCHRIFT@@\n\nDie Aufnahme ist angehängt.\n
skipms=3000
maxsilence=10
silencethreshold=128
maxlogins=3
sendvoicemail=no
; Werte aus cme-web (maxmsg, maxsecs, ...)
#include cme/vm_general.conf

[zonemessages]
european=Europe/Berlin|'vm-received' Q 'digits/at' kM

[default]
; Postfaecher aus cme-web
#include cme/mailboxes.conf
