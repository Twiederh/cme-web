; Asterisk nimmt nur Anrufe von CME an und meldet neue Nachrichten (MWI) an CME.
[global]
type=global
user_agent=cme-voicemail
endpoint_identifier_order=ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@HOST_IP@
external_signaling_address=@HOST_IP@
local_net=@LOCAL_NET@

[cme]
type=aor
contact=sip:@CME_IP@:5060

[cme]
type=identify
endpoint=cme
match=@CME_IP@

[cme]
type=endpoint
transport=transport-udp
context=from-cme
disallow=all
allow=g722,alaw,ulaw
aors=cme
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733
language=de
trust_id_inbound=yes

; Ein Eintrag je Postfach fuer die MWI-Meldung an CME (schreibt cme-web)
#include cme/pjsip_mwi.conf
