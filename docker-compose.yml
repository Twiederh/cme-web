services:
  cme-web:
    # Fertige Images aus GitHub (.github/workflows/images.yml); selbst bauen: docker-compose.build.yml
    image: ${IMAGE_PREFIX:-ghcr.io/twiederh}/cme-web:${IMAGE_TAG:-latest}
    labels:
      # Updates über Portainer (Pull and redeploy), nicht über Watchtower – kein Neustart mitten im Gespräch
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: cme-web
    restart: unless-stopped
    ports:
      - "${CME_WEB_PORT:-8080}:8080"
      # Telefondienste (Visual Voicemail) fuer die Cisco-Telefone, nur /ipphone/...
      - "${CME_PHONE_PORT:-8081}:8081"
      # Shared Line fuer Fremdgeraete (sharedline.py): NOTIFYs der CME an die stellvertretenden Abos
      - "${SHARED_LINE_PORT:-5074}:${SHARED_LINE_PORT:-5074}/udp"
    environment:
      CME_HOST: ${CME_HOST}
      CME_USER: ${CME_USER}
      CME_PASSWORD: ${CME_PASSWORD}
      CME_SECRET: ${CME_SECRET:-}
      CME_SSH_PORT: ${CME_SSH_PORT:-22}
      CME_WEB_USER: ${CME_WEB_USER}
      CME_WEB_PASS: ${CME_WEB_PASS}
      CME_DEMO: ${CME_DEMO:-false}
      TZ: Europe/Berlin
      # Anmeldung (siehe README: "Anmeldung mit Authentik / Pocket-ID")
      CME_PUBLIC_URL: ${CME_PUBLIC_URL:-}
      CME_SECRET_KEY: ${CME_SECRET_KEY:-}
      OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
      OIDC_AUTHENTIK_ISSUER: ${OIDC_AUTHENTIK_ISSUER:-}
      OIDC_AUTHENTIK_CLIENT_ID: ${OIDC_AUTHENTIK_CLIENT_ID:-}
      OIDC_AUTHENTIK_CLIENT_SECRET: ${OIDC_AUTHENTIK_CLIENT_SECRET:-}
      OIDC_AUTHENTIK_LABEL: ${OIDC_AUTHENTIK_LABEL:-Authentik}
      OIDC_POCKETID_ISSUER: ${OIDC_POCKETID_ISSUER:-}
      OIDC_POCKETID_CLIENT_ID: ${OIDC_POCKETID_CLIENT_ID:-}
      OIDC_POCKETID_CLIENT_SECRET: ${OIDC_POCKETID_CLIENT_SECRET:-}
      OIDC_POCKETID_LABEL: ${OIDC_POCKETID_LABEL:-Pocket-ID}
      OIDC_POCKETID_SCOPES: ${OIDC_POCKETID_SCOPES:-openid email profile groups}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_ALLOWED_USERS: ${OIDC_ALLOWED_USERS:-}
      CME_ADMIN_GROUPS: ${CME_ADMIN_GROUPS:-cme-admins}
      # Voicemail (Container cme-voicemail, siehe README)
      VM_HOST_IP: ${VM_HOST_IP:-}
      VM_AMI_SECRET: ${VM_AMI_SECRET:-}
      VM_AMI_HOST: asterisk
      VM_SMTP_USER: ${VM_SMTP_USER:-}
      VM_REC_DIR: /data/recordings
      # Visual Voicemail: Port, unter dem die Telefone cme-web erreichen (siehe ports)
      CME_PHONE_URL_PORT: ${CME_PHONE_PORT:-8081}
      SHARED_LINE_PORT: ${SHARED_LINE_PORT:-5074}
      # CME Phone (Tab Softphone, siehe softphone/README.md)
      PHONEAPP_DATA_DIR: /data/push
      SIP_DOMAIN: ${SIP_DOMAIN:-cme.local}
      SIP_GW_NAME: ${SIP_GW_NAME:-}
      # Adressen <name>@SIP_PUBLIC_DOMAIN für Anrufe von draußen (aus den E-Mail-Adressen im Tab Benutzer)
      SIP_PUBLIC_DOMAIN: ${SIP_PUBLIC_DOMAIN:-}
      # Apps über TLS zum Gateway (1 = ja, Standard: wenn SIP_PUBLIC_DOMAIN gesetzt ist), Port wie Kamailio
      SIP_GW_TLS: ${SIP_GW_TLS:-}
      # Konferenzen in Jitsi (Tab Jitsi): Port von Kamailio für CME und Jigasi
      CONF_PORT: ${CONF_PORT:-5068}
      EXT_TLS_PORT: ${EXT_TLS_PORT:-5061}
      SIP_GW_PORT: ${SIP_GW_PORT:-5062}
      # Kamailio: Ziel des Pools MOB<Nummer> bei CME (sharedline.py)
      B2BUA_PORT: ${B2BUA_PORT:-5064}
      RELAY_LOCALPUSH_PORT: ${RELAY_LOCALPUSH_PORT:-5072}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-de.wiederhol.cmephone}
    volumes:
      - vm-config:/data/asterisk
      - vm-spool:/data/voicemail
      - recordings:/data/recordings
      - softphone-data:/data/push
    depends_on:
      - asterisk

  # Asterisk als Voicemail fuer CME. Braucht auf dem Docker-Host UDP 5060 und 10000-10049.
  asterisk:
    image: ${IMAGE_PREFIX:-ghcr.io/twiederh}/cme-voicemail:${IMAGE_TAG:-latest}
    labels:
      # Updates über Portainer (Pull and redeploy), nicht über Watchtower – kein Neustart mitten im Gespräch
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: cme-voicemail
    # Audio in Echtzeit (Ansagen, Voicemail, Konferenz): bei knapper CPU zuerst bedienen
    cpu_shares: 4096
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      HOST_IP: ${VM_HOST_IP:-}
      CME_IP: ${CME_HOST}
      AMI_SECRET: ${VM_AMI_SECRET:-}
      TZ: Europe/Berlin
      # Mail mit Abschrift (Standard: iCloud)
      SMTP_HOST: ${VM_SMTP_HOST:-smtp.mail.me.com}
      SMTP_PORT: ${VM_SMTP_PORT:-587}
      SMTP_USER: ${VM_SMTP_USER:-}
      SMTP_PASSWORD: ${VM_SMTP_PASSWORD:-}
      SMTP_FROM: ${VM_SMTP_FROM:-}
      WHISPER_URL: http://whisper:9000
    ports:
      - "5060:5060/udp"
      - "10000-10049:10000-10049/udp"
    volumes:
      - vm-config:/etc/asterisk/cme
      - vm-spool:/var/spool/asterisk/voicemail

  # Gespraechsaufzeichnung: nimmt die vom Router (SIPREC) kopierten Gespraeche an.
  # Braucht auf dem Docker-Host UDP/TCP 5070 und UDP 10100-10139.
  recorder:
    image: ${IMAGE_PREFIX:-ghcr.io/twiederh}/cme-recorder:${IMAGE_TAG:-latest}
    labels:
      # Updates über Portainer (Pull and redeploy), nicht über Watchtower – kein Neustart mitten im Gespräch
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: cme-recorder
    # Gespraechsaufzeichnung (RTP in Echtzeit): bei knapper CPU zuerst bedienen
    cpu_shares: 4096
    restart: unless-stopped
    environment:
      HOST_IP: ${VM_HOST_IP:-}
      CME_IP: ${CME_HOST}
      TZ: Europe/Berlin
      WHISPER_URL: http://whisper:9000
      SMTP_HOST: ${VM_SMTP_HOST:-smtp.mail.me.com}
      SMTP_PORT: ${VM_SMTP_PORT:-587}
      SMTP_USER: ${VM_SMTP_USER:-}
      SMTP_PASSWORD: ${VM_SMTP_PASSWORD:-}
      SMTP_FROM: ${VM_SMTP_FROM:-}
    ports:
      - "5070:5070/udp"
      - "5070:5070/tcp"
      - "10100-10139:10100-10139/udp"
    volumes:
      - vm-config:/config:ro
      - recordings:/recordings

  # Spracherkennung fuer die Abschrift der Voicemails (lokal, nur im Docker-Netz erreichbar)
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    labels:
      # Updates über Portainer (Pull and redeploy), nicht über Watchtower – kein Neustart mitten im Gespräch
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: cme-whisper
    # Abschrift ist nicht eilig: niedrige Prioritaet und hoechstens 2 der 4 Kerne, damit Asterisk und der
    # Recorder beim Transkribieren nicht ins Stocken geraten
    cpu_shares: 128
    cpus: "2.0"
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${VM_WHISPER_MODEL:-small}
    volumes:
      - whisper-cache:/root/.cache


  # ---------------- CME Phone (Softphone, Ordner softphone/) ----------------
  # SIP-Server der Apps (iPhone/iPad): Registrar, Proxy zur CME, Push über push-relay (Ordner kamailio/).
  # Die Apps melden sich hier an (TCP/UDP SIP_GW_PORT, 5062); CME klingelt den Pool MOB<Nummer> unter
  # VM_HOST_IP:B2BUA_PORT (5064, nur UDP von der CME). Host-Netz (SIP braucht die echten Absender-IPs).
  kamailio:
    image: ${IMAGE_PREFIX:-ghcr.io/twiederh}/cme-kamailio:${IMAGE_TAG:-latest}
    labels:
      # Updates über Portainer (Pull and redeploy), nicht über Watchtower – kein Neustart mitten im Gespräch
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: cme-kamailio
    # SIP-Signalisierung der Apps: vor den uebrigen Diensten, hinter Asterisk/Recorder
    cpu_shares: 2048
    network_mode: host
    restart: unless-stopped
    environment:
      HOST_IP: ${VM_HOST_IP:?VM_HOST_IP = LAN-IP des Docker-Hosts setzen}
      CME_IP: ${CME_HOST}
      SIP_DOMAIN: ${SIP_DOMAIN:-cme.local}
      SIP_PORT: ${SIP_GW_PORT:-5062}
      # Zugang von außen (leer = aus): SIP_GW_NAME mit TCP EXT_SIP_PORT und TLS EXT_TLS_PORT,
      # Anrufe an <name>@SIP_PUBLIC_DOMAIN gehen über VM_HOST_IP:CME_EXT_PORT an die CME
      SIP_GW_NAME: ${SIP_GW_NAME:-}
      SIP_PUBLIC_DOMAIN: ${SIP_PUBLIC_DOMAIN:-}
      EXT_SIP_PORT: ${EXT_SIP_PORT:-5060}
      EXT_TLS_PORT: ${EXT_TLS_PORT:-5061}
      # UDP von draußen (Router: UDP 5060 -> VM_HOST_IP:EXT_UDP_PORT, 5060 belegt hier Asterisk)
      EXT_UDP_PORT: ${EXT_UDP_PORT:-5067}
      CME_EXT_PORT: ${CME_EXT_PORT:-5066}
      # Konferenzen in Jitsi über Jigasi (cme-web Tab Jitsi): CME und Jigasi kommen über UDP CONF_PORT
      CONF_PORT: ${CONF_PORT:-5068}
      # Contact des Pools MOB<Nummer> bei CME (cme-web meldet ihn mit diesem Port an)
      B2BUA_PORT: ${B2BUA_PORT:-5064}
      RELAY_PORT: ${RELAY_HTTP_PORT:-8092}
      # JSON-RPC für cme-web (Anmeldestatus der Apps)
      RPC_PORT: ${KAMAILIO_RPC_PORT:-5069}
      # 1 = SRTP zu den Apps (Standard), 0 = unverschlüsselt
      APP_SRTP: ${APP_SRTP:-1}
      KAMAILIO_LOG_LEVEL: ${KAMAILIO_LOG_LEVEL:-2}
      TZ: Europe/Berlin
    volumes:
      # Anmeldungen der Apps (überstehen einen Neustart)
      - kamailio-data:/data/kamailio
      # Passwoerter der Apps (cme-web schreibt flexisip-passwd) und Adressen (sip-aliases), nur lesbar
      - softphone-data:/data/push:ro
      # Zugang von außen: Zertifikat für SIP_GW_NAME (cert.pem mit Kette, key.pem) in TLS_CERT_DIR ablegen,
      # z.B. - /pfad/zu/zertifikat:/data/tls:ro und TLS_CERT_DIR: /data/tls

  # Medien der Apps: SRTP zu den iOS-Geräten, RTP zur CME (gesteuert von Kamailio, Ordner rtpengine/).
  # Braucht UDP APP_RTP_PORTS (40000-40199) auf VM_HOST_IP.
  rtpengine:
    image: ${IMAGE_PREFIX:-ghcr.io/twiederh}/cme-rtpengine:${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: cme-rtpengine
    # Medien: gleiche Priorität wie Asterisk/Recorder
    cpu_shares: 4096
    network_mode: host
    restart: unless-stopped
    environment:
      HOST_IP: ${VM_HOST_IP:?VM_HOST_IP = LAN-IP des Docker-Hosts setzen}
      RTP_PORTS: ${APP_RTP_PORTS:-40000-40199}
      # Zugang von außen: öffentliche Adresse fürs SDP (leer = SIP_GW_NAME über 1.1.1.1 auflösen)
      SIP_GW_NAME: ${SIP_GW_NAME:-}
      SIP_PUBLIC_DOMAIN: ${SIP_PUBLIC_DOMAIN:-}
      SIP_PUBLIC_IP: ${SIP_PUBLIC_IP:-}
      TZ: Europe/Berlin

  # Weckt schlafende Apps: im Heim-WLAN per Local Push (TCP RELAY_LOCALPUSH_PORT, 5072), sonst per APNs.
  # Eingerichtet wird er in cme-web (Tab Softphone): APNs-Schluessel und Secret liegen im Volume softphone-data.
  push-relay:
    image: ${IMAGE_PREFIX:-ghcr.io/twiederh}/cme-push-relay:${IMAGE_TAG:-latest}
    labels:
      # Updates über Portainer (Pull and redeploy), nicht über Watchtower – kein Neustart mitten im Gespräch
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: cme-push-relay
    network_mode: host
    restart: unless-stopped
    environment:
      RELAY_HTTP_HOST: 127.0.0.1
      RELAY_HTTP_PORT: ${RELAY_HTTP_PORT:-8092}
      RELAY_LOCALPUSH_HOST: 0.0.0.0
      RELAY_LOCALPUSH_PORT: ${RELAY_LOCALPUSH_PORT:-5072}
      RELAY_DATA_DIR: /data
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-de.wiederhol.cmephone}
      LOG_LEVEL: INFO
      TZ: Europe/Berlin
    volumes:
      - softphone-data:/data

volumes:
  vm-config:
  vm-spool:
  whisper-cache:
  recordings:
  softphone-data:
  kamailio-data:
