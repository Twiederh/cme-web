services:
  cme-web:
    build: .
    image: cme-web:latest
    container_name: cme-web
    restart: unless-stopped
    ports:
      - "${CME_WEB_PORT:-8080}:8080"
      # Telefondienste (Visual Voicemail) fuer die Cisco-Telefone, nur /ipphone/...
      - "${CME_PHONE_PORT:-8081}:8081"
    environment:
      CME_HOST: ${CME_HOST}
      CME_USER: ${CME_USER}
      CME_PASSWORD: ${CME_PASSWORD}
      CME_SECRET: ${CME_SECRET:-}
      CME_SSH_PORT: ${CME_SSH_PORT:-22}
      CME_WEB_USER: ${CME_WEB_USER}
      CME_WEB_PASS: ${CME_WEB_PASS}
      CME_DEMO: ${CME_DEMO:-false}
      TZ: Europe/Berlin
      # Anmeldung (siehe README: "Anmeldung mit Authentik / Pocket-ID")
      CME_PUBLIC_URL: ${CME_PUBLIC_URL:-}
      CME_SECRET_KEY: ${CME_SECRET_KEY:-}
      OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
      OIDC_AUTHENTIK_ISSUER: ${OIDC_AUTHENTIK_ISSUER:-}
      OIDC_AUTHENTIK_CLIENT_ID: ${OIDC_AUTHENTIK_CLIENT_ID:-}
      OIDC_AUTHENTIK_CLIENT_SECRET: ${OIDC_AUTHENTIK_CLIENT_SECRET:-}
      OIDC_AUTHENTIK_LABEL: ${OIDC_AUTHENTIK_LABEL:-Authentik}
      OIDC_POCKETID_ISSUER: ${OIDC_POCKETID_ISSUER:-}
      OIDC_POCKETID_CLIENT_ID: ${OIDC_POCKETID_CLIENT_ID:-}
      OIDC_POCKETID_CLIENT_SECRET: ${OIDC_POCKETID_CLIENT_SECRET:-}
      OIDC_POCKETID_LABEL: ${OIDC_POCKETID_LABEL:-Pocket-ID}
      OIDC_POCKETID_SCOPES: ${OIDC_POCKETID_SCOPES:-openid email profile groups}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_ALLOWED_USERS: ${OIDC_ALLOWED_USERS:-}
      CME_ADMIN_GROUPS: ${CME_ADMIN_GROUPS:-cme-admins}
      # Voicemail (Container cme-voicemail, siehe README)
      VM_HOST_IP: ${VM_HOST_IP:-}
      VM_AMI_SECRET: ${VM_AMI_SECRET:-}
      VM_AMI_HOST: asterisk
      VM_SMTP_USER: ${VM_SMTP_USER:-}
      VM_REC_DIR: /data/recordings
      # Visual Voicemail: Port, unter dem die Telefone cme-web erreichen (siehe ports)
      CME_PHONE_URL_PORT: ${CME_PHONE_PORT:-8081}
      # CME Phone (Tab Softphone, siehe softphone/README.md)
      PHONEAPP_DATA_DIR: /data/push
      SIP_GW_NAME: ${SIP_GW_NAME:-}
      SIP_GW_PORT: ${SIP_GW_PORT:-5062}
      RELAY_LOCALPUSH_PORT: ${RELAY_LOCALPUSH_PORT:-5072}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-de.wiederhol.cmephone}
    volumes:
      - vm-config:/data/asterisk
      - vm-spool:/data/voicemail
      - recordings:/data/recordings
      - softphone-data:/data/push
    depends_on:
      - asterisk

  # Asterisk als Voicemail fuer CME. Braucht auf dem Docker-Host UDP 5060 und 10000-10049.
  asterisk:
    build: ./asterisk
    image: cme-voicemail:latest
    container_name: cme-voicemail
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      HOST_IP: ${VM_HOST_IP:-}
      CME_IP: ${CME_HOST}
      AMI_SECRET: ${VM_AMI_SECRET:-}
      TZ: Europe/Berlin
      # Mail mit Abschrift (Standard: iCloud)
      SMTP_HOST: ${VM_SMTP_HOST:-smtp.mail.me.com}
      SMTP_PORT: ${VM_SMTP_PORT:-587}
      SMTP_USER: ${VM_SMTP_USER:-}
      SMTP_PASSWORD: ${VM_SMTP_PASSWORD:-}
      SMTP_FROM: ${VM_SMTP_FROM:-}
      WHISPER_URL: http://whisper:9000
    ports:
      - "5060:5060/udp"
      - "10000-10049:10000-10049/udp"
    volumes:
      - vm-config:/etc/asterisk/cme
      - vm-spool:/var/spool/asterisk/voicemail

  # Gespraechsaufzeichnung: nimmt die vom Router (SIPREC) kopierten Gespraeche an.
  # Braucht auf dem Docker-Host UDP/TCP 5070 und UDP 10100-10139.
  recorder:
    build: ./recorder
    image: cme-recorder:latest
    container_name: cme-recorder
    restart: unless-stopped
    environment:
      HOST_IP: ${VM_HOST_IP:-}
      CME_IP: ${CME_HOST}
      TZ: Europe/Berlin
      WHISPER_URL: http://whisper:9000
      SMTP_HOST: ${VM_SMTP_HOST:-smtp.mail.me.com}
      SMTP_PORT: ${VM_SMTP_PORT:-587}
      SMTP_USER: ${VM_SMTP_USER:-}
      SMTP_PASSWORD: ${VM_SMTP_PASSWORD:-}
      SMTP_FROM: ${VM_SMTP_FROM:-}
    ports:
      - "5070:5070/udp"
      - "5070:5070/tcp"
      - "10100-10139:10100-10139/udp"
    volumes:
      - vm-config:/config:ro
      - recordings:/recordings

  # Spracherkennung fuer die Abschrift der Voicemails (lokal, nur im Docker-Netz erreichbar)
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: cme-whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${VM_WHISPER_MODEL:-small}
    volumes:
      - whisper-cache:/root/.cache


  # ---------------- CME Phone (Softphone, Ordner softphone/) ----------------
  # Push-Gateway vor CME: Die Apps melden sich hierueber an, CME schickt eingehende Anrufe hierher.
  # Host-Netz (SIP braucht die echten Absender-IPs), nicht hinter Traefik. Braucht TCP/UDP SIP_GW_PORT (5062).
  # Das Image baut beim ersten Mal 20-40 Minuten (Flexisip aus den Quellen); vorher von Hand bauen geht schneller:
  #   docker build -t flexisip:local ./flexisip
  flexisip:
    build:
      context: ./flexisip
      args:
        FLEXISIP_VERSION: "2.6.2"
        LINPHONESDK_VERSION: "5.5.16"
        NJOBS: "4"
    image: flexisip:local
    container_name: cme-flexisip
    network_mode: host
    restart: unless-stopped
    environment:
      HOST_IP: ${VM_HOST_IP:?VM_HOST_IP = LAN-IP des Docker-Hosts setzen}
      SIP_GW_NAME: ${SIP_GW_NAME:-}
      SIP_PORT: ${SIP_GW_PORT:-5062}
      RELAY_PORT: ${RELAY_HTTP_PORT:-8092}
      LOG_LEVEL: ${FLEXISIP_LOG_LEVEL:-message}
      TZ: Europe/Berlin
    volumes:
      - flexisip-conf:/etc/flexisip
      - flexisip-log:/var/opt/belledonne-communications/log/flexisip

  # Weckt schlafende Apps: im Heim-WLAN per Local Push (TCP RELAY_LOCALPUSH_PORT, 5072), sonst per APNs.
  # Eingerichtet wird er in cme-web (Tab Softphone): APNs-Schluessel und Secret liegen im Volume softphone-data.
  push-relay:
    build: ./push-relay
    image: cme-push-relay:latest
    container_name: cme-push-relay
    network_mode: host
    restart: unless-stopped
    environment:
      RELAY_HTTP_HOST: 127.0.0.1
      RELAY_HTTP_PORT: ${RELAY_HTTP_PORT:-8092}
      RELAY_LOCALPUSH_HOST: 0.0.0.0
      RELAY_LOCALPUSH_PORT: ${RELAY_LOCALPUSH_PORT:-5072}
      RELAY_DATA_DIR: /data
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-de.wiederhol.cmephone}
      LOG_LEVEL: INFO
      TZ: Europe/Berlin
    volumes:
      - softphone-data:/data

volumes:
  vm-config:
  vm-spool:
  whisper-cache:
  recordings:
  softphone-data:
  flexisip-conf:
  flexisip-log:
