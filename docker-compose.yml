services:
  cme-web:
    build: .
    image: cme-web:latest
    container_name: cme-web
    restart: unless-stopped
    ports:
      - "${CME_WEB_PORT:-8080}:8080"
    environment:
      CME_HOST: ${CME_HOST}
      CME_USER: ${CME_USER}
      CME_PASSWORD: ${CME_PASSWORD}
      CME_SECRET: ${CME_SECRET:-}
      CME_SSH_PORT: ${CME_SSH_PORT:-22}
      CME_WEB_USER: ${CME_WEB_USER}
      CME_WEB_PASS: ${CME_WEB_PASS}
      CME_DEMO: ${CME_DEMO:-false}
      TZ: Europe/Berlin
      # Anmeldung (siehe README: "Anmeldung mit Authentik / Pocket-ID")
      CME_PUBLIC_URL: ${CME_PUBLIC_URL:-}
      CME_SECRET_KEY: ${CME_SECRET_KEY:-}
      OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
      OIDC_AUTHENTIK_ISSUER: ${OIDC_AUTHENTIK_ISSUER:-}
      OIDC_AUTHENTIK_CLIENT_ID: ${OIDC_AUTHENTIK_CLIENT_ID:-}
      OIDC_AUTHENTIK_CLIENT_SECRET: ${OIDC_AUTHENTIK_CLIENT_SECRET:-}
      OIDC_AUTHENTIK_LABEL: ${OIDC_AUTHENTIK_LABEL:-Authentik}
      OIDC_POCKETID_ISSUER: ${OIDC_POCKETID_ISSUER:-}
      OIDC_POCKETID_CLIENT_ID: ${OIDC_POCKETID_CLIENT_ID:-}
      OIDC_POCKETID_CLIENT_SECRET: ${OIDC_POCKETID_CLIENT_SECRET:-}
      OIDC_POCKETID_LABEL: ${OIDC_POCKETID_LABEL:-Pocket-ID}
      OIDC_POCKETID_SCOPES: ${OIDC_POCKETID_SCOPES:-openid email profile groups}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_ALLOWED_USERS: ${OIDC_ALLOWED_USERS:-}
      # Voicemail (Container cme-voicemail, siehe README)
      VM_HOST_IP: ${VM_HOST_IP:-}
      VM_AMI_SECRET: ${VM_AMI_SECRET:-}
      VM_AMI_HOST: asterisk
    volumes:
      - vm-config:/data/asterisk
      - vm-spool:/data/voicemail
    depends_on:
      - asterisk

  # Asterisk als Voicemail fuer CME. Braucht auf dem Docker-Host UDP 5060 und 10000-10049.
  asterisk:
    build: ./asterisk
    image: cme-voicemail:latest
    container_name: cme-voicemail
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      HOST_IP: ${VM_HOST_IP:-}
      CME_IP: ${CME_HOST}
      AMI_SECRET: ${VM_AMI_SECRET:-}
      TZ: Europe/Berlin
    ports:
      - "5060:5060/udp"
      - "10000-10049:10000-10049/udp"
    volumes:
      - vm-config:/etc/asterisk/cme
      - vm-spool:/var/spool/asterisk/voicemail

volumes:
  vm-config:
  vm-spool:
