!
! CME (vcube, IOS XE 17.12) – Tischtelefon per Mac steuern
! ---------------------------------------------------------------------------
! Hinweis: CTI/CSTA gibt es in CME seit 12.6 (IOS XE 16.11.1a) nicht mehr und
! funktionierte vorher nur mit SCCP-Telefonen. Deshalb steuert CME Phone für macOS
! das Telefon über Cisco IP Phone XML Services (HTTP POST /CGI/Execute) und liest den
! Leitungszustand per SIP-Statusabo (SUBSCRIBE dialog bzw. presence).
!
! Annahmen (anpassen!):
!   Tischtelefon 8851       = Nst. 10, IP 192.168.11.50
!   Mac (CME Phone)         = Nst. 23 (eigener Pool, direkt oder via Flexisip)
!   Mac-IP / Netz           = 192.168.11.0/24
!
! Alle Befehle vor dem Übernehmen mit "?" gegen 17.12 prüfen – Syntax kann je Version leicht abweichen.

! --- 1. Execute-Authentifizierung ------------------------------------------
! Das Telefon fragt bei jedem CGI/Execute die "Authentication URL" ab. CME beantwortet
! das selbst (authenticate.asp), wenn ein Benutzer hinterlegt ist.
ip http server
ip http authentication local
!
voice register global
 url authentication http://192.168.11.4/CCMCIP/authenticate.asp
 authentication credential cmephone GEHEIMES-PASSWORT
 ! nach Änderung: create profile + Telefone neu starten (die URL wird beim Booten geladen)
 create profile
!
! Web-Zugriff am Telefon muss an sein (Telefon-Webseite http://192.168.11.50 erreichbar).
! Falls deaktiviert, je nach CME-Version über die Vendor-Konfiguration einschalten, z.B.:
! voice register template 1
!  service webAccess 0
!

! --- 2. Statusabo (BLF) für das Tischtelefon --------------------------------
sip-ua
 presence enable
!
presence
 allow subscribe
 watcher all
!
voice register dn 10
 allow watch
!

! --- 3. Mac als eigene Nebenstelle ------------------------------------------
voice register dn 23
 number 23
 name Mac Thomas
 label Mac
!
voice register pool 23
 ! direkt am Mac (ohne Flexisip): Netz des Macs
 id network 192.168.11.0 mask 255.255.255.0
 number 1 dn 23
 dtmf-relay rtp-nte
 voice-class codec 21
 no vad
 description CME Phone macOS
!
! Achtung: "id network" mit ganzem /24 erlaubt jedem Gerät im Netz, sich als 23 zu melden.
! Enger: Mac-IP fest per DHCP-Reservierung vergeben und "id network <Mac-IP> mask 255.255.255.255".

! Prüfen:
! show voice register pool 23
! show presence subscription summary
! debug ccsip messages          (SUBSCRIBE/NOTIFY sehen)
! Test vom Mac aus (Terminal):
!   curl -u cmephone:GEHEIMES-PASSWORT --data-urlencode 'XML=<CiscoIPPhoneExecute><ExecuteItem URL="Dial:23"/></CiscoIPPhoneExecute>' \
!        http://192.168.11.50/CGI/Execute
