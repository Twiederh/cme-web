name: CMEPhone
options:
  bundleIdPrefix: de.wiederhol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "83BLV56527"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
    CURRENT_PROJECT_VERSION: "1"
    # Apple Vision Pro: die iPad-App läuft dort als "Designed for iPad" (kein eigenes visionOS-SDK von Linphone)
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES

packages:
  linphonesw:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios
    branch: stable                 # stable = mit Video (novideo/* NICHT verwenden)

targets:
  CMEPhone:
    type: application
    platform: iOS
    sources:
      - path: CMEPhone
      - path: Shared
    dependencies:
      - package: linphonesw
        product: linphonesw
      - sdk: CallKit.framework
      - sdk: PushKit.framework
      # >>> LOCALPUSH  (nur mit LOCALPUSH=1 zsh build.command – Apple vergibt das Entitlement auf Antrag)
      - target: LocalPushProvider
        embed: true
      - sdk: NetworkExtension.framework
      # <<< LOCALPUSH
    info:
      path: CMEPhone/Resources/Info.plist
      properties:
        CFBundleDisplayName: CME Phone
        CFBundleShortVersionString: "0.1.0"
        # Build-Nummer: für jeden TestFlight-Upload erhöhen (CURRENT_PROJECT_VERSION, z.B. per build.command)
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Nur Standard-Verschlüsselung (TLS/SRTP) -> keine Exportdokumente für TestFlight/App Store nötig
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [voip, audio, remote-notification]
        NSMicrophoneUsageDescription: Für Telefonate über die Cisco-Telefonanlage.
        NSCameraUsageDescription: Für Videoanrufe.
        NSLocalNetworkUsageDescription: Verbindung zur Telefonanlage und zum Push-Dienst im Heimnetz.
        NSSiriUsageDescription: Anrufe über CME Phone mit Siri starten.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Anrufen aus "Zuletzt", Kontakte und Siri
        NSUserActivityTypes: [INStartCallIntent, INStartAudioCallIntent, INStartVideoCallIntent]
        # tel:-Links, wenn CME Phone als Standard-App für Anrufe gewählt ist (iOS 18.2+)
        CFBundleURLTypes:
          - CFBundleURLName: de.wiederhol.cmephone.call
            CFBundleURLSchemes: [tel, cmephone]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: CMEPhone/Resources/CMEPhone.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.de.wiederhol.cmephone]
        # Local Push (app-push-provider) vergibt Apple nur auf Antrag – build.command fügt es mit LOCALPUSH=1 ein
        # Auswählbar unter Einstellungen → Apps → Standard-Apps → Anrufe (iOS 18.2+)
        com.apple.developer.calling-app: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wiederhol.cmephone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # >>> LOCALPUSH
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LOCALPUSH
        # <<< LOCALPUSH

  # >>> LOCALPUSH
  LocalPushProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: LocalPushProvider
      - path: Shared
    dependencies:
      - sdk: NetworkExtension.framework
    info:
      path: LocalPushProvider/Info.plist
      properties:
        CFBundleDisplayName: CME Phone Local Push
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"   # muss zur App passen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.app-push
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PushProvider
    entitlements:
      path: LocalPushProvider/LocalPushProvider.entitlements
      properties:
        com.apple.security.application-groups: [group.de.wiederhol.cmephone]
        # Local Push (app-push-provider) vergibt Apple nur auf Antrag – build.command fügt es mit LOCALPUSH=1 ein
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wiederhol.cmephone.localpush
  # <<< LOCALPUSH
