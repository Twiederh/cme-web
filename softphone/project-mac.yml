# Eigenes Xcode-Projekt für macOS (CMEPhoneMac.xcodeproj).
# SIP über baresip: third_party/build/CMESIP.xcframework (third_party/fetch.sh + build.sh),
# SIPManager (CMEPhone/Core/SIPManager.swift) gemeinsam mit iOS.
#   xcodegen generate --spec project-mac.yml
name: CMEPhoneMac
options:
  bundleIdPrefix: de.wiederhol
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"   # LastUpgradeCheck, sonst meldet Xcode "Update to recommended settings"

settings:
  base:
    # von Xcode empfohlene Einstellungen
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: "83BLV56527"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Build-Nummer und -Info: build.command setzt beide aus Git (Anzahl Commits, Hash, Zeit)
    CURRENT_PROJECT_VERSION: "1"
    CME_BUILD_INFO: "Xcode"

targets:
  CMEPhoneMac:
    type: application
    platform: macOS
    sources:
      - path: CMEPhoneMac
      - path: Shared
      - path: CMEPhone/Core
        excludes:
          - CallKitProvider.swift        # iOS: CallKit
          - LocalPushController.swift    # iOS: Local Push
    dependencies:
      - framework: third_party/build/CMESIP.xcframework
        embed: false
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libz.tbd
      - sdk: libresolv.tbd
      - sdk: UserNotifications.framework
      - sdk: Contacts.framework
    info:
      path: CMEPhoneMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: CME Phone
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CMEBuildInfo: "$(CME_BUILD_INFO)"
        LSApplicationCategoryType: public.app-category.business
        # Nur Menüleiste, kein Dock-Symbol
        LSUIElement: true
        NSAppSleepDisabled: true          # kein App Nap (SIP-Anmeldung muss laufen)
        NSContactsUsageDescription: Zeigt Name und Bild des Anrufers aus deinen Kontakten.
        NSMicrophoneUsageDescription: Für Telefonate über die Cisco-Telefonanlage.
        NSCameraUsageDescription: Für Videoanrufe.
        NSLocalNetworkUsageDescription: Verbindung zur Telefonanlage und zum Cisco-Tischtelefon.
        NSAppTransportSecurity:
          # Cisco-Telefone sprechen CGI/Execute nur per HTTP – im LAN (IP-Adressen) erlauben
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: de.wiederhol.cmephone.call
            CFBundleURLSchemes: [tel, sip, sips, callto]
            CFBundleTypeRole: Viewer
          - CFBundleURLName: de.wiederhol.cmephone.app
            CFBundleURLSchemes: [cmephone]
            CFBundleTypeRole: Viewer
    entitlements:
      path: CMEPhoneMac/Resources/CMEPhoneMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true     # eingehende SIP/RTP-Pakete
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.application-groups: [group.de.wiederhol.cmephone]
        com.apple.security.personal-information.addressbook: true   # Anrufer aus Kontakte
        com.apple.security.assets.music.read-write: true            # lokale Aufnahmen in ~/Musik/CME Phone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wiederhol.cmephone.mac
        PRODUCT_NAME: CMEPhone              # CMEPhone.app
        PRODUCT_MODULE_NAME: CMEPhoneMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
