!
! Cisco CME (vcube, ISR 1100, IOS XE 17.12) – Ergänzungen für CME Phone
! ---------------------------------------------------------------------------
! Annahmen (anpassen!):
!   docker01 (Flexisip)   = 192.168.1.110
!   Softphone iPhone      = Nst. 21
!   Softphone iPad        = Nst. 22
!
! Vor dem Einspielen sichern:  copy running-config flash:pre-softphone.cfg
!

! --- 1. Codec-Liste für Softphones -----------------------------------------
! Reihenfolge = Präferenz von CME. Opus/H.265 kennt CME nicht als Codec-Klasse;
! sie werden nur im "codec transparent"-Fall zwischen zwei Softphones durchgereicht (Abschnitt 5).
voice class codec 21
 codec preference 1 g722-64
 codec preference 2 g711alaw
 codec preference 3 g711ulaw
 video codec h264
!

! --- 2. SIP-Grundlagen (meist schon vorhanden – nur prüfen) ----------------
voice service voip
 allow-connections sip to sip
 ! Video zwischen SIP-Endpunkten zulassen (CME reicht Video im Flow-through durch)
 sip
  ! Flexisip schickt den Contact mit CtRt…;doroute – CME muss diese URI-Parameter beim
  ! INVITE an das Softphone beibehalten (siehe README, Test "Eingehend").
!

! --- 3. Nummern ------------------------------------------------------------
voice register dn 21
 number 21
 name iPhone Thomas
 label iPhone
 allow watch
!
voice register dn 22
 number 22
 name iPad Thomas
 label iPad
!

! --- 4. Pools: wie Jabber über den Gerätenamen ---------------------------------
! Am einfachsten in cme-web: Tab Telefone → Telefon anlegen → Typ „CME Phone“.
! Im CME-Modus nimmt der Router nur MAC-Adressen oder – für Softclients – einen Gerätenamen an
! ("id network" wird abgelehnt). Die App schickt im REGISTER den Contact-Parameter
! +u.sip!devicename.ccm.cisco.com="CMEP<Nebenstelle>" mit, so wie Jabber.
voice register pool 21
 id device-id-name CMEP21
 type Jabber-CSF-Client
 number 1 dn 21
 dtmf-relay rtp-nte
 voice-class codec 21
 no vad
 description CME Phone iPhone (via Flexisip)
!
voice register pool 22
 id device-id-name CMEP22
 type Jabber-CSF-Client
 number 1 dn 22
 dtmf-relay rtp-nte
 voice-class codec 21
 no vad
 description CME Phone iPad (via Flexisip)
!

! --- 5. (Optional, Experiment) Opus/H.265 zwischen Softphones ---------------
! CME bildet für registrierte Telefone eigene Dial-Peers; ein statischer Dial-Peer mit
! "codec transparent" kann das SDP unverändert durchreichen. Nur zum Testen Softphone<->Softphone!
!
! voice class codec 99
!  codec preference 1 g722-64
! dial-peer voice 2122 voip
!  description Softphone-zu-Softphone transparent
!  destination-pattern 2[12]
!  session protocol sipv2
!  session target ipv4:192.168.1.110:5062
!  session transport tcp
!  codec transparent
!  dtmf-relay rtp-nte
!  preference 9
!

! --- 6. Parallelruf mit Tischtelefon (Shared Line light) ----------------------
! Beispiel: Anrufe auf 10 klingeln auch am iPhone (21). Variante über Hunt-Group:
!
! voice hunt-group 1 parallel
!  list 10,21
!  pilot 110
!
! oder direkt in der DN des Tischtelefons:
! voice register dn 10
!  call-forward b2bua ... (nicht parallel)  -> besser Hunt-Group oder "shared-line" (nur Cisco-Phones)

! Abschluss:
! write memory
! show voice register pool 21
! show voice register dn 21
! show sip-ua status registrar
