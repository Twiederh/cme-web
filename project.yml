name: CMEPhone
options:
  bundleIdPrefix: de.wiederhol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "83BLV56527"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad

packages:
  linphonesw:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios
    branch: stable                 # stable = mit Video (novideo/* NICHT verwenden)

targets:
  CMEPhone:
    type: application
    platform: iOS
    sources:
      - path: CMEPhone
      - path: Shared
    dependencies:
      - package: linphonesw
        product: linphonesw
      - target: LocalPushProvider
        embed: true
      - sdk: CallKit.framework
      - sdk: PushKit.framework
      - sdk: NetworkExtension.framework
    info:
      path: CMEPhone/Resources/Info.plist
      properties:
        CFBundleDisplayName: CME Phone
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [voip, audio, remote-notification]
        NSMicrophoneUsageDescription: Für Telefonate über die Cisco-Telefonanlage.
        NSCameraUsageDescription: Für Videoanrufe.
        NSLocalNetworkUsageDescription: Verbindung zur Telefonanlage und zum Push-Dienst im Heimnetz.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: CMEPhone/Resources/CMEPhone.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.de.wiederhol.cmephone]
        com.apple.developer.networking.networkextension: [app-push-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wiederhol.cmephone

  LocalPushProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: LocalPushProvider
      - path: Shared
    dependencies:
      - sdk: NetworkExtension.framework
    info:
      path: LocalPushProvider/Info.plist
      properties:
        CFBundleDisplayName: CME Phone Local Push
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.app-push
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PushProvider
    entitlements:
      path: LocalPushProvider/LocalPushProvider.entitlements
      properties:
        com.apple.security.application-groups: [group.de.wiederhol.cmephone]
        com.apple.developer.networking.networkextension: [app-push-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wiederhol.cmephone.localpush
