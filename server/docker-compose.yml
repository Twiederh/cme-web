# Portainer-Stack "cme-softphone-gateway" auf docker01
#
# Portainer: Stacks → Add stack → Repository
#   URL:          https://gitea.wiederhol.de/thomas/cme-softphone
#   Compose path: server/docker-compose.yml
#   Env:          RELAY_LOCALPUSH_SECRET, RELAY_ADMIN_PASSWORD
#   Optional:     RELAY_LOCALPUSH_PORT (5070), RELAY_ADMIN_PORT (8091), RELAY_HTTP_PORT (8090),
#                 falls auf docker01 schon belegt (Host-Netz!). Prüfen: ss -tulpn | grep -E ':(5070|8090|8091)\b'
#                 Bei geändertem RELAY_HTTP_PORT auch external-push-uri in flexisip.conf anpassen,
#                 bei geändertem RELAY_LOCALPUSH_PORT den Relay-Port in der App.
#   APNs-Schlüssel: im Browser hochladen unter http://<docker01>:8091/ (Benutzer "admin")
#   "Enable relative path volumes": AUS (alle Pfade sind absolut)
#
# Traefik bewusst NICHT davor: SIP (UDP/TCP) und der Local-Push-Kanal sind keine HTTP-Dienste.
# Ein Proxy davor würde die Absender-IPs verstecken (NAT-/Contact-Behandlung in Flexisip bricht)
# und RTP läuft ohnehin direkt zwischen Telefon und CME.
#
# Beide Container laufen im Host-Netz:
#  - Flexisip braucht SIP auf der LAN-IP und muss CME (192.168.11.4) direkt erreichen
#  - der Relay muss für Flexisip unter 127.0.0.1:8090 erreichbar sein,
#    für die iPhones/iPads unter <docker01>:5070 (Local Push)
#    und für dich unter <docker01>:8091 (Verwaltung, APNs-Schlüssel hochladen)
#
# Flexisip-Image: wird beim ersten Deploy aus server/flexisip/Dockerfile gebaut (20–40 Min.).
# Empfohlen (kein Portainer-Timeout): vorher einmal per SSH auf docker01 bauen:
#   git clone https://gitea.wiederhol.de/thomas/cme-softphone.git /tmp/cme-softphone
#   docker build -t flexisip:local /tmp/cme-softphone/server/flexisip
# Ist das Image vorhanden, nutzt der Stack es direkt.

services:
  flexisip:
    build:
      context: ./flexisip
      args:
        FLEXISIP_VERSION: "2.6.2"
        LINPHONESDK_VERSION: "5.5.16"
        NJOBS: "4"
    image: flexisip:local
    container_name: flexisip
    network_mode: host
    restart: unless-stopped
    command: ["flexisip", "--server", "proxy", "-c", "/etc/flexisip/flexisip.conf"]
    volumes:
      - /opt/containers/cme-softphone/flexisip:/etc/flexisip:ro
      - /opt/containers/cme-softphone/flexisip-log:/var/opt/belledonne-communications/log/flexisip

  push-relay:
    build: ./push-relay
    image: cme-push-relay:latest
    container_name: cme-push-relay
    network_mode: host
    restart: unless-stopped
    environment:
      RELAY_HTTP_HOST: 127.0.0.1
      RELAY_HTTP_PORT: ${RELAY_HTTP_PORT:-8090}
      RELAY_LOCALPUSH_HOST: 0.0.0.0
      RELAY_LOCALPUSH_PORT: ${RELAY_LOCALPUSH_PORT:-5070}
      RELAY_LOCALPUSH_SECRET: ${RELAY_LOCALPUSH_SECRET:?Secret setzen (openssl rand -hex 24)}
      # Verwaltung (APNs-Schlüssel hochladen): http://<docker01>:8091/, Benutzer "admin"
      RELAY_ADMIN_PORT: ${RELAY_ADMIN_PORT:-8091}
      RELAY_ADMIN_PASSWORD: ${RELAY_ADMIN_PASSWORD:?Admin-Passwort für die Verwaltung setzen}
      RELAY_DATA_DIR: /data
      APNS_BUNDLE_ID: de.wiederhol.cmephone
      # Optional statt Upload (Upload hat Vorrang): APNS_KEY_ID, APNS_TEAM_ID, APNS_ENV + Datei unter APNS_KEY_PATH
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_ENV: ${APNS_ENV:-auto}
      APNS_KEY_PATH: /data/env/AuthKey.p8
      LOG_LEVEL: INFO
    volumes:
      - relay-data:/data

volumes:
  relay-data:
